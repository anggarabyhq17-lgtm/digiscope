<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Digiscope</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080C14',     
                        cardBg: '#111827',     
                        borderDark: '#1F293D',
                        accent: {
                            DEFAULT: '#FF5722', 
                            hover: '#FF7043'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-darkBg text-gray-200 antialiased flex items-center justify-center h-screen selection:bg-accent selection:text-white">

    <div class="max-w-md w-full mx-4 bg-cardBg border border-borderDark p-8 rounded-2xl shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-white tracking-tight">Digi<span class="text-accent">scope</span> Admin</h1>
            <p class="text-xs text-gray-400">Silakan masukkan akun kredensial terdaftar untuk masuk.</p>
        </div>

        <div id="errorAlert" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 text-xs p-3 rounded-xl text-center font-bold">
            Username atau Password salah!
        </div>

        <form onsubmit="prosesLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1">Username Admin</label>
                <input type="text" id="username" required placeholder="Contoh: admin" class="w-full bg-darkBg border border-borderDark rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accent">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-darkBg border border-borderDark rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accent">
            </div>

            <button type="submit" class="w-full bg-accent hover:bg-accent-hover text-white text-xs font-bold py-3 rounded-xl transition shadow-lg shadow-accent/20 cursor-pointer mt-2">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="text-center">
            <a href="index.php" class="text-xs text-gray-500 hover:text-gray-300 transition">&larr; Kembali ke Beranda Website</a>
        </div>
    </div>

    <script>
        // Jika sudah terlanjur login, langsung arahkan ke admin.html
        if (localStorage.getItem('digiscopeLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }

        function prosesLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // KREDENSIAL ADMIN YANG DIIZINKAN MASUK
            // Kamu bisa ubah username dan password di sini sesuai keinginan
            const adminData = {
                "admin": "digiscope2026",
                "redaksi": "beritadigiscope"
            };

            if (adminData[user] && adminData[user] === pass) {
                localStorage.setItem('digiscopeLoggedIn', 'true');
                localStorage.setItem('digiscopeUser', user);
                window.location.href = 'admin.html';
            } else {
                const alertBox = document.getElementById('errorAlert');
                alertBox.classList.remove('hidden');
                setTimeout(() => alertBox.classList.add('hidden'), 3000);
            }
        }
    </script>
</body>
</html>
